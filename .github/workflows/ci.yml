name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build, tests base de données
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Types de base de données à jour avec les migrations
        run: npm run types:check

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne contacte pas Supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

      - name: Tests unitaires (PDF, calculs)
        run: npm run test:unit

      - name: Tests des Edge Functions (Node)
        run: npm run test:functions

      - name: Migrations + tests (Postgres embarqué)
        run: npm run test:db

  e2e:
    name: Test navigateur (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Test navigateur (faux serveur Supabase)
        run: npm run test:e2e

  facturx:
    name: Factur-X (validation Mustang)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: .cache/mustang
          key: mustang-2.26.0

      - run: npm ci

      - name: Valider les Factur-X (PDF/A-3 + EN 16931 + règles françaises)
        run: npm run test:facturx
